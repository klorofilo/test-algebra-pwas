<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fichas de repaso — Examen de admisión</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  :root{
    --paper:#F7F5EE; --paper-2:#EFEBDF; --rule:#C9D6E8; --margin:#E6B4B4;
    --ink:#1B2A4A; --pen:#1F4DA3; --red:#B8262B; --green:#2E7D4F; --muted:#6B7280;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
  button{font:inherit;cursor:pointer}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}

  header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
  header h1{margin:0;font-size:1.35rem;font-weight:600;letter-spacing:.01em}
  header .sub{font-size:.85rem;color:var(--muted)}
  .score{font-family:"Courier New",monospace;font-size:1.05rem;text-align:right;line-height:1.2}
  .score b{font-size:1.5rem;color:var(--pen)}
  .score .r{color:var(--red)} .score .g{color:var(--green)}

  .modes{display:flex;gap:6px;margin-bottom:12px}
  .modes button{flex:1;padding:9px 6px;border:1.5px solid var(--ink);background:transparent;border-radius:3px;font-weight:600}
  .modes button.on{background:var(--ink);color:var(--paper)}

  .topics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
  .topics button{padding:5px 11px;border:1px solid var(--muted);background:transparent;border-radius:999px;font-size:.85rem;color:var(--ink)}
  .topics button.on{border-color:var(--pen);color:var(--pen);background:#E9EFFA}
  .topics button .n{color:var(--red);font-family:"Courier New",monospace;font-size:.8rem;margin-left:4px}

  /* ficha */
  .stage{perspective:1400px}
  .ficha{position:relative;width:100%;min-height:260px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.1,.2,1)}
  .ficha.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid #CFCABB;border-radius:4px;box-shadow:0 1px 0 #fff inset,0 6px 18px rgba(27,42,74,.10);
    background:
      linear-gradient(90deg, transparent 44px, var(--margin) 44px, var(--margin) 45px, transparent 45px),
      repeating-linear-gradient(0deg, transparent 0 27px, var(--rule) 27px 28px),
      #FCFBF6;
    background-position:0 0,0 46px,0 0;
    padding:20px 24px 24px 60px;display:flex;flex-direction:column}
  .face.back{transform:rotateY(180deg)}
  .face .eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;justify-content:space-between}
  .face .body{flex:1;display:flex;align-items:center;font-size:1.2rem;line-height:1.5}
  .face.back .body{color:var(--pen)}
  .face .hint{font-size:.85rem;color:var(--muted);text-align:right}
  .katex{font-size:1.15em}

  .actions{display:flex;gap:8px;margin-top:14px}
  .actions button{flex:1;padding:12px;border-radius:3px;border:1.5px solid;font-weight:600}
  .b-flip{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  .b-no{border-color:var(--red);color:var(--red);background:transparent}
  .b-yes{border-color:var(--green);color:var(--green);background:transparent}
  .b-yes:hover{background:#E6F2EA}.b-no:hover{background:#F8E6E6}
  .hidden{display:none!important}

  .done{border:1px dashed var(--muted);padding:22px;border-radius:4px;text-align:center}
  .done h2{margin:0 0 6px;font-weight:600}
  .done ul{list-style:none;padding:0;margin:12px 0;text-align:left;display:inline-block}
  .done li{font-family:"Courier New",monospace;font-size:.9rem}

  /* memorama */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
  .mcard{aspect-ratio:3/4;perspective:900px;background:none;border:0;padding:0}
  .mcard .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .35s}
  .mcard.up .in{transform:rotateY(180deg)}
  .mcard .f{position:absolute;inset:0;backface-visibility:hidden;border-radius:4px;border:1px solid #CFCABB;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;font-size:.86rem;line-height:1.3}
  .mcard .f.front{background:repeating-linear-gradient(45deg,#DCE3F0 0 4px,#E9EEF7 4px 8px)}
  .mcard .f.back{transform:rotateY(180deg);background:#FCFBF6;color:var(--ink)}
  .mcard.matched .f.back{background:#E6F2EA;border-color:var(--green);color:var(--green)}
  .mcard .f.back .katex{font-size:.95em}
  .mstat{display:flex;justify-content:space-between;font-family:"Courier New",monospace;font-size:.9rem;margin:0 0 10px;color:var(--muted)}
  .b-round{margin-top:14px;width:100%;padding:12px;border-radius:3px;border:1.5px solid var(--ink);background:transparent;font-weight:600}

  @media(prefers-reduced-motion:reduce){.ficha,.mcard .in{transition:none}}
  button:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Fichas de repaso</h1>
      <div class="sub">Posgrado en Ciencias Físicas · lo que el examen 2027-1 mostró que falta</div>
    </div>
    <div class="score" id="score"><b>0</b> / 0<br><span class="g">✓ 0</span> · <span class="r">✗ 0</span></div>
  </header>

  <div class="modes">
    <button id="m-repaso" class="on">Repaso (recordar)</button>
    <button id="m-memo">Memorama (reconocer)</button>
  </div>
  <div class="topics" id="topics"></div>

  <!-- REPASO -->
  <section id="repaso">
    <div class="stage">
      <div class="ficha" id="ficha">
        <div class="face front">
          <div class="eyebrow"><span id="f-topic"></span><span id="f-count"></span></div>
          <div class="body" id="f-q"></div>
          <div class="hint">toca para voltear</div>
        </div>
        <div class="face back">
          <div class="eyebrow"><span>Respuesta</span><span id="f-count2"></span></div>
          <div class="body" id="f-a"></div>
          <div class="hint" id="f-note"></div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="b-flip" id="b-flip">Voltear</button>
      <button class="b-no hidden" id="b-no">No lo sabía</button>
      <button class="b-yes hidden" id="b-yes">Lo sabía</button>
    </div>
    <div class="done hidden" id="done"></div>
  </section>

  <!-- MEMORAMA -->
  <section id="memo" class="hidden">
    <div class="mstat"><span id="ms-pairs">0 / 8 pares</span><span id="ms-moves">0 intentos</span></div>
    <div class="grid" id="grid"></div>
    <button class="b-round" id="b-round">Nueva ronda</button>
  </section>
</div>

<script>
// ---------- DECK ----------
// q: prompt (text or $latex$), a: answer, n: short note on the trap
const T = {termo:'Termodinámica', clasica:'Mecánica clásica', cuantica:'Mecánica cuántica', em:'Electromagnetismo', moderna:'Física moderna'};
const DECK = [

 {t:'termo', q:'Relación de Maxwell a partir de $F(T,V)$', a:'$\\left(\\dfrac{\\partial S}{\\partial V}\\right)_T = \\left(\\dfrac{\\partial P}{\\partial T}\\right)_V$', n:''},
 {t:'termo', q:'Relación de Maxwell a partir de $G(T,P)$', a:'$\\left(\\dfrac{\\partial S}{\\partial P}\\right)_T = -\\left(\\dfrac{\\partial V}{\\partial T}\\right)_P$', n:''},
 {t:'termo', q:'Primera ecuación $T\\,dS$ (variables $T,V$)', a:'$T\\,dS = C_V\\,dT + T\\left(\\dfrac{\\partial P}{\\partial T}\\right)_V dV$', n:''},

 {t:'termo', q:'$\\gamma = C_P/C_V$ para un gas ideal diatómico (O$_2$, N$_2$)', a:'$\\gamma = 7/5$', n:'$C_V = \\tfrac{5}{2}R$, $C_P = \\tfrac{7}{2}R$ por mol.'},
 {t:'termo', q:'Relación cíclica entre tres variables ligadas por $f(x,y,z)=0$', a:'$\\left(\\dfrac{\\partial x}{\\partial y}\\right)_z\\left(\\dfrac{\\partial y}{\\partial z}\\right)_x\\left(\\dfrac{\\partial z}{\\partial x}\\right)_y = -1$', n:'Con esto y la regla de la cadena se demuestran identidades como la de T2.'},
 {t:'termo', q:'Identidad: $\\left(\\frac{\\partial U}{\\partial T}\\right)_P\\left(\\frac{\\partial T}{\\partial P}\\right)_V = -\\left(\\frac{\\partial U}{\\partial V}\\right)_P\\left(\\frac{\\partial V}{\\partial P}\\right)_T$. ¿Idea de la prueba?', a:'Regla de la cadena: escribe $\\left(\\frac{\\partial U}{\\partial P}\\right)_V$ con $U(T,P)$ y $\\left(\\frac{\\partial U}{\\partial P}\\right)_T$ con $U(V,P)$; al combinarlas se cancela y queda la identidad.', n:'Es cálculo puro; no hacen falta $dU$ ni Maxwell.'},

 // Mecánica clásica
 {t:'clasica', q:'Masa reducida del problema de dos cuerpos', a:'$\\mu = \\dfrac{m_1 m_2}{m_1 + m_2}$', n:''},
 {t:'clasica', q:'¿Por qué el centro de masa se mueve inercialmente si sólo hay fuerzas internas?', a:'$\\mathbf F_{12} = -\\mathbf F_{21}$ (3ª ley) $\\Rightarrow M\\ddot{\\mathbf R} = \\mathbf F_{12}+\\mathbf F_{21} = 0$', n:'Se demuestra sumando las ecuaciones de Newton.'},

 {t:'clasica', q:'Hamiltoniano radial tras eliminar $\\theta$', a:'$H = \\dfrac{p_r^2}{2\\mu} + \\dfrac{\\ell^2}{2\\mu r^2} + U(r)$', n:''},

 {t:'clasica', q:'Modos normales de $U = y^2 + 1 + \\cos x$ alrededor de $(\\pi,0)$', a:'$m\\ddot{\\xi} = -\\xi,\\; m\\ddot y = -2y \\Rightarrow \\omega_x = 1/\\sqrt m,\\; \\omega_y = \\sqrt{2/m}$', n:'Con $\\xi = x - \\pi$.'},

 // Mecánica cuántica
 {t:'cuantica', q:'Relaciones de conmutación canónicas', a:'$[\\hat x_i, \\hat p_j] = i\\hbar\\,\\delta_{ij},\\quad [\\hat x_i,\\hat x_j] = [\\hat p_i,\\hat p_j] = 0$', n:'Son estas tres; $[H,L]=0$ no es canónica ni general.'},
 {t:'cuantica', q:'$[\\hat p, f(\\hat x)]$', a:'$-i\\hbar\\, f\'(\\hat x)$', n:'Porque $\\hat p = -i\\hbar\\,\\partial_x$ actuando sobre $f\\psi$.'},
 {t:'cuantica', q:'$[\\hat x, g(\\hat p)]$', a:'$i\\hbar\\, g\'(\\hat p)$', n:''},
 {t:'cuantica', q:'Velocidad de una partícula cargada en un campo magnético (momento cinético)', a:'$\\hat{\\mathbf V} = \\dfrac{1}{\\mu}\\left(\\hat{\\mathbf P} - q\\mathbf A\\right)$', n:'$\\hat{\\mathbf P}$ es canónico; $\\mu\\hat{\\mathbf V}$ es cinético.'},

 {t:'cuantica', q:'Evolución temporal de un valor esperado', a:'$\\dfrac{d\\langle \\hat A\\rangle}{dt} = \\dfrac{i}{\\hbar}\\langle[\\hat H,\\hat A]\\rangle + \\left\\langle\\dfrac{\\partial \\hat A}{\\partial t}\\right\\rangle$', n:''},

 {t:'cuantica', q:'Teorema de Ehrenfest', a:'$\\dfrac{d\\langle x\\rangle}{dt} = \\dfrac{\\langle p\\rangle}{m},\\quad \\dfrac{d\\langle p\\rangle}{dt} = -\\left\\langle V\'(x)\\right\\rangle$', n:''},

 // Física moderna

 {t:'moderna', q:'Invariante energía–momento', a:'$E^2 - p^2c^2 = m^2c^4$', n:''},
 {t:'moderna', q:'Fusión $m + m \\to M$ liberando $Q$', a:'$M = 2m - \\dfrac{Q}{c^2}$', n:''},

// ---------- RENDER HELPERS ----------
function renderMath(el, s){
  el.innerHTML='';
  const parts = s.split(/(\$[^$]+\$)/g);
  parts.forEach(p=>{
    if(p.startsWith('$') && p.endsWith('$')){
      const span=document.createElement('span');
      try{ katex.render(p.slice(1,-1), span, {throwOnError:false, displayMode:false}); }
      catch(e){ span.textContent=p.slice(1,-1); }
      el.appendChild(span);
    } else if(p){ el.appendChild(document.createTextNode(p)); }
  });
}
const $=id=>document.getElementById(id);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

// ---------- STATE ----------
let selected = new Set(Object.keys(T));
let stats = {yes:0,no:0, miss:{}};   // miss per topic
Object.keys(T).forEach(k=>stats.miss[k]=0);
let mode='repaso';

function renderTopics(){
  const box=$('topics'); box.innerHTML='';
  Object.entries(T).forEach(([k,label])=>{
    const b=document.createElement('button');
    b.className=selected.has(k)?'on':'';
    b.innerHTML=label+(stats.miss[k]?`<span class="n">✗${stats.miss[k]}</span>`:'');
    b.onclick=()=>{ if(selected.has(k)&&selected.size>1) selected.delete(k); else selected.add(k); renderTopics(); mode==='repaso'?startRepaso():startMemo(); };
    box.appendChild(b);
  });
}
function renderScore(){
  const tot=stats.yes+stats.no;
  $('score').innerHTML=`<b>${stats.yes}</b> / ${tot}<br><span class="g">✓ ${stats.yes}</span> · <span class="r">✗ ${stats.no}</span>`;
}

// ---------- REPASO ----------
let queue=[], cur=null, seen=0, total=0, flipped=false;
function startRepaso(){
  queue=shuffle(DECK.filter(c=>selected.has(c.t)).slice());
  total=queue.length; seen=0;
  $('done').classList.add('hidden'); $('ficha').classList.remove('hidden'); document.querySelector('.actions').classList.remove('hidden');
  next();
}
function next(){
  if(!queue.length){ finish(); return; }
  cur=queue.shift(); seen++; flipped=false;
  $('ficha').classList.remove('flipped');
  $('f-topic').textContent=T[cur.t];
  $('f-count').textContent=$('f-count2').textContent=`${seen} de ${total}${queue.length+seen>total?' (+repaso)':''}`;
  renderMath($('f-q'),cur.q); renderMath($('f-a'),cur.a); renderMath($('f-note'),cur.n||'');
  $('b-flip').classList.remove('hidden'); $('b-yes').classList.add('hidden'); $('b-no').classList.add('hidden');
}
function flip(){
  if(flipped) return; flipped=true;
  $('ficha').classList.add('flipped');
  $('b-flip').classList.add('hidden'); $('b-yes').classList.remove('hidden'); $('b-no').classList.remove('hidden');
}
function grade(ok){
  if(!flipped) return;
  if(ok){stats.yes++;} else {stats.no++; stats.miss[cur.t]++; queue.push(cur); total++;}
  renderScore(); renderTopics();
  setTimeout(next,150);
}
function finish(){
  $('ficha').classList.add('hidden'); document.querySelector('.actions').classList.add('hidden');
  const d=$('done'); d.classList.remove('hidden');
  const rows=Object.entries(T).filter(([k])=>selected.has(k)).map(([k,l])=>`<li>${l.padEnd(20,'\u00a0')} ✗ ${stats.miss[k]}</li>`).join('');
  d.innerHTML=`<h2>Ronda terminada</h2><div>Acertaste ${stats.yes} de ${stats.yes+stats.no} intentos.</div><ul>${rows}</ul><button class="b-round" id="b-again">Otra ronda</button>`;
  $('b-again').onclick=startRepaso;
}
$('ficha').onclick=flip; $('b-flip').onclick=flip;
$('b-yes').onclick=()=>grade(true); $('b-no').onclick=()=>grade(false);
document.addEventListener('keydown',e=>{
  if(mode!=='repaso') return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}
  if(e.key==='ArrowRight'||e.key==='1') grade(true);
  if(e.key==='ArrowLeft'||e.key==='0') grade(false);
});

// ---------- MEMORAMA ----------
let open=[], lock=false, pairs=0, moves=0, NP=8;
function startMemo(){
  const pool=shuffle(DECK.filter(c=>selected.has(c.t)&&c.a.length<140).slice()).slice(0,NP);
  NP=pool.length; pairs=0; moves=0; open=[]; lock=false;
  const cards=[]; pool.forEach((c,i)=>{cards.push({id:i,side:'q',txt:c.q});cards.push({id:i,side:'a',txt:c.a});});
  shuffle(cards);
  const g=$('grid'); g.innerHTML='';
  cards.forEach(c=>{
    const b=document.createElement('button'); b.className='mcard'; b.dataset.id=c.id;
    const inner=document.createElement('div'); inner.className='in';
    const f=document.createElement('div'); f.className='f front';
    const k=document.createElement('div'); k.className='f back'; renderMath(k,c.txt);
    inner.append(f,k); b.appendChild(inner);
    b.onclick=()=>tap(b); g.appendChild(b);
  });
  updMs();
}
function updMs(){ $('ms-pairs').textContent=`${pairs} / ${NP} pares`; $('ms-moves').textContent=`${moves} intentos`; }
function tap(b){
  if(lock||b.classList.contains('up')||b.classList.contains('matched')) return;
  b.classList.add('up'); open.push(b);
  if(open.length===2){
    moves++; lock=true;
    const [a,c]=open;
    if(a.dataset.id===c.dataset.id){ a.classList.add('matched'); c.classList.add('matched'); pairs++; open=[]; lock=false; }
    else setTimeout(()=>{a.classList.remove('up');c.classList.remove('up');open=[];lock=false;},900);
    updMs();
  }
}
$('b-round').onclick=startMemo;

// ---------- MODES ----------
function setMode(m){
  mode=m;
  $('m-repaso').classList.toggle('on',m==='repaso'); $('m-memo').classList.toggle('on',m==='memo');
  $('repaso').classList.toggle('hidden',m!=='repaso'); $('memo').classList.toggle('hidden',m!=='memo');
  m==='repaso'?startRepaso():startMemo();
}
$('m-repaso').onclick=()=>setMode('repaso'); $('m-memo').onclick=()=>setMode('memo');

renderTopics(); renderScore(); startRepaso();
</script>
</body>
</html>
